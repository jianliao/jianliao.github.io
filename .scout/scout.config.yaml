# Scout per-repo config template.
#
# Seeded into `<repo>/.scout/scout.config.yaml` by `scout attach` when the
# repo has no config yet.  Templates here only carry the repo-specific
# ignore / dampen / boost / tune overrides; defaults for
# repository/markdown/ranking/index/projects are filled in at load time.
ignore:
  # --- derived from .gitignore at attach; edit or remove freely (not regenerated) ---
  - 'node_modules/**'
  - '.pnp/**'
  - '**/.pnp.*'
  - 'coverage/**'
  - '.next/**'
  - 'out/**'
  - 'build/**'
  - '.DS_Store'
  - '*.pem'
  - '**/npm-debug.log*'
  - '**/yarn-debug.log*'
  - '**/yarn-error.log*'
  - '**/.pnpm-debug.log*'
  - '**/.env*'
  - '.vercel'
  - '*.tsbuildinfo'
  - 'next-env.d.ts'
  - '**/CHANGELOG.md'
  - '**/CHANGELOG*'
  - '**/CHANGES.md'
  - '**/HISTORY.md'

dampen:
  - factor: 0.3
    patterns:
      - '**/package.json'
